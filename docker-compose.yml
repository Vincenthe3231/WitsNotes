services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: witsnote
      POSTGRES_USER: witsnote
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U witsnote"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  collab:
    build: ./collab
    env_file: ./collab/.env.local
    environment:
      COLLAB_PORT: 1234
      LARAVEL_INTERNAL_URL: http://host.docker.internal:8000/api/internal
    ports:
      - "1234:1234"
    volumes:
      - collab_witslog_data:/app/.witslog
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1234/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: witsnote
      MINIO_ROOT_PASSWORD: secret123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  collab_witslog_data:
